name: Windows app

on:
  push:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test the application
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run the tests
        run: python -m pytest tests -q

      - name: Check that the application can be used
        run: python -m seal --check

  build:
    name: Build the executable
    needs: test
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: python -m PyInstaller --noconfirm --clean Seal.spec

      - name: Check that the executable starts
        run: |
          .\dist\Seal.exe --version
          .\dist\Seal.exe --check

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Seal-windows
          path: desktop/dist/Seal.exe
          if-no-files-found: error
          retention-days: 14
