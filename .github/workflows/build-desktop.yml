name: Build Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build Windows Executable
      run: ./gradlew :desktop:packageReleaseExe --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Seal-Desktop-Windows
        path: desktop/build/compose/binaries/main/exe/*.exe
